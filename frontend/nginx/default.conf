server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA entry: landing at `/` — never redirect root to /login
    location = / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    location = /robots.txt {
        default_type text/plain;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        try_files $uri =404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 200 "ok\n";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Vue Router history mode — all app routes fall back to SPA shell
    location = /login {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files /index.html =404;
    }

    location ~ ^/(?:dashboard|requests|expenses|wallet|attendance|cloud|support|chat|hq|approvals|reports|users|settings)(?:/|$) {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
