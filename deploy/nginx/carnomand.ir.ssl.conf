upstream carnomand_gateway {
    server 127.0.0.1:18090;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name carnomand.ir www.carnomand.ir;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://carnomand.ir$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name carnomand.ir www.carnomand.ir;

    ssl_certificate /etc/letsencrypt/live/carnomand.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/carnomand.ir/privkey.pem;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;

    if ($host = www.carnomand.ir) {
        return 301 https://carnomand.ir$request_uri;
    }

    client_max_body_size 64m;

    # Root and all SPA paths proxy to gateway.
    # Landing is served by the Vue app at `/` — do not redirect `/` to `/login`.
    location / {
        proxy_pass http://carnomand_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        # Avoid caching the HTML shell so deploys are visible immediately
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }
}
