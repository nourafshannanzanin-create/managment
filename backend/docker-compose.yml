name: workflow-hub

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${WORKFLOW_MYSQL_DATABASE}
      MYSQL_USER: ${WORKFLOW_MYSQL_USER}
      MYSQL_PASSWORD: ${WORKFLOW_MYSQL_PASSWORD}
    volumes:
      - ../docker-data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WORKFLOW_APP_NAME: ${WORKFLOW_APP_NAME:-Workflow Hub API}
      WORKFLOW_API_V1_PREFIX: ${WORKFLOW_API_V1_PREFIX:-/api/v1}
      WORKFLOW_APP_HOST: ${WORKFLOW_APP_HOST:-0.0.0.0}
      WORKFLOW_APP_PORT: ${WORKFLOW_APP_PORT:-8000}
      WORKFLOW_DEBUG: ${WORKFLOW_DEBUG:-false}
      WORKFLOW_SECRET_KEY: ${WORKFLOW_SECRET_KEY}
      WORKFLOW_ACCESS_TOKEN_EXPIRE_MINUTES: ${WORKFLOW_ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      WORKFLOW_MYSQL_HOST: db
      WORKFLOW_MYSQL_PORT: 3306
      WORKFLOW_MYSQL_USER: ${WORKFLOW_MYSQL_USER}
      WORKFLOW_MYSQL_PASSWORD: ${WORKFLOW_MYSQL_PASSWORD}
      WORKFLOW_MYSQL_DATABASE: ${WORKFLOW_MYSQL_DATABASE}
      WORKFLOW_ALLOWED_HOSTS: ${WORKFLOW_ALLOWED_HOSTS:-carnomand.ir,www.carnomand.ir,127.0.0.1,localhost,backend,gateway-nginx}
      WORKFLOW_FRONTEND_ORIGINS: ${WORKFLOW_FRONTEND_ORIGINS:-https://carnomand.ir,https://www.carnomand.ir}
      WORKFLOW_CSRF_TRUSTED_ORIGINS: ${WORKFLOW_CSRF_TRUSTED_ORIGINS:-https://carnomand.ir,https://www.carnomand.ir}
      WORKFLOW_CORS_ALLOW_ALL_ORIGINS: ${WORKFLOW_CORS_ALLOW_ALL_ORIGINS:-false}
      WORKFLOW_SECURE_SSL_REDIRECT: ${WORKFLOW_SECURE_SSL_REDIRECT:-false}
      WORKFLOW_SESSION_COOKIE_SECURE: ${WORKFLOW_SESSION_COOKIE_SECURE:-true}
      WORKFLOW_CSRF_COOKIE_SECURE: ${WORKFLOW_CSRF_COOKIE_SECURE:-true}
      WORKFLOW_SECURE_HSTS_SECONDS: ${WORKFLOW_SECURE_HSTS_SECONDS:-31536000}
      WORKFLOW_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${WORKFLOW_SECURE_HSTS_INCLUDE_SUBDOMAINS:-true}
      WORKFLOW_SECURE_HSTS_PRELOAD: ${WORKFLOW_SECURE_HSTS_PRELOAD:-false}
      WORKFLOW_USE_X_FORWARDED_HOST: ${WORKFLOW_USE_X_FORWARDED_HOST:-true}
      WORKFLOW_MEDIA_URL: ${WORKFLOW_MEDIA_URL:-/uploads/}
      WORKFLOW_UPLOAD_DIR: ${WORKFLOW_UPLOAD_DIR:-uploads}
      WORKFLOW_STATIC_ROOT: ${WORKFLOW_STATIC_ROOT:-staticfiles}
      WORKFLOW_AUTO_INIT_DB: ${WORKFLOW_AUTO_INIT_DB:-true}
      WORKFLOW_AUTO_SEED_DB: ${WORKFLOW_AUTO_SEED_DB:-false}
      WORKFLOW_DB_WAIT_TIMEOUT: ${WORKFLOW_DB_WAIT_TIMEOUT:-90}
      WORKFLOW_CACHE_BACKEND: ${WORKFLOW_CACHE_BACKEND:-redis}
      WORKFLOW_REDIS_URL: ${WORKFLOW_REDIS_URL:-redis://redis:6379/1}
      WORKFLOW_DB_CONN_MAX_AGE: ${WORKFLOW_DB_CONN_MAX_AGE:-60}
      WORKFLOW_PUBLIC_APP_URL: ${WORKFLOW_PUBLIC_APP_URL:-https://carnomand.ir}
      WORKFLOW_NESHAN_SERVICE_KEY: ${WORKFLOW_NESHAN_SERVICE_KEY:-}
      WORKFLOW_NESHAN_REVERSE_URL: ${WORKFLOW_NESHAN_REVERSE_URL:-https://api.neshan.org/v5/reverse}
      IRANPAYAMAK_BASE_URL: ${IRANPAYAMAK_BASE_URL:-https://api.iranpayamak.com}
      IRANPAYAMAK_LINE_NUMBER: ${IRANPAYAMAK_LINE_NUMBER:-}
      IRANPAYAMAK_API_KEY: ${IRANPAYAMAK_API_KEY:-}
      SMS_PRICE_PER_100_CHARS: ${SMS_PRICE_PER_100_CHARS:-185}
      SMS_PRICE_PER_SEGMENT: ${SMS_PRICE_PER_SEGMENT:-185}
      SMS_CHARS_PER_SEGMENT: ${SMS_CHARS_PER_SEGMENT:-70}
      ORG_TRIAL_HOURS: ${ORG_TRIAL_HOURS:-24}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../docker-data/uploads:/app/uploads
      - ../docker-data/staticfiles:/app/staticfiles
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -H 'Host: 127.0.0.1' http://127.0.0.1:8000/api/v1/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_NESHAN_SERVICE_KEY: ${VITE_NESHAN_SERVICE_KEY:-}
        VITE_NESHAN_REVERSE_URL: ${VITE_NESHAN_REVERSE_URL:-https://api.neshan.org/v5/reverse}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  gateway-nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "${GATEWAY_BIND_IP:-127.0.0.1}:${GATEWAY_PORT:-18090}:80"
    volumes:
      - ../docker/gateway-nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../docker-data/uploads:/app/uploads:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
