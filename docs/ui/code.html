<!DOCTYPE html>

<html dir="rtl" lang="fa"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ثبت و ارجاع درخواست - سیستم داخلی</title>
<!-- Tailwind CSS v3 CDN with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-blue': '#1e4b8a',
            'brand-bg': '#f8fafc',
            'priority-critical': '#fee2e2',
            'priority-critical-text': '#ef4444',
            'priority-medium': '#dbeafe',
            'priority-medium-text': '#3b82f6',
          },
          fontFamily: {
            sans: ['Tahoma', 'Arial', 'sans-serif'], // Standard Persian-friendly fonts for desktop apps
          },
        }
      }
    }
  </script>
<style data-purpose="custom-styling">
    /* Custom scrollbar for desktop app look */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    
    /* Input focus ring customization */
    .focus-ring:focus {
      outline: none;
      ring: 2px;
      ring-color: #1e4b8a;
      border-color: #1e4b8a;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6 font-sans">
<!-- BEGIN: MainContainer -->
<main class="bg-white w-full max-w-4xl shadow-2xl rounded-3xl overflow-hidden flex flex-col h-[90vh]" data-purpose="app-window">
<!-- BEGIN: HeaderSection -->
<header class="p-8 pb-4 relative">
<div class="flex justify-between items-center mb-6">
<button class="text-slate-400 hover:text-slate-600 transition-colors" title="بستن">
<svg class="h-6 w-6" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<div class="bg-orange-50 text-orange-600 px-4 py-1.5 rounded-full flex items-center gap-2 text-sm font-medium border border-orange-100">
           درخواست جدید
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
<div class="text-center">
<h1 class="text-3xl font-bold text-slate-800 mb-4">ثبت و ارجاع درخواست</h1>
<p class="text-slate-500 text-sm max-w-lg mx-auto leading-relaxed">
          لطفاً اطلاعات زیر را برای ارجاع هوشمند تکمیل نمایید تا فرآیند پیگیری با دقت بیشتری انجام شود.
        </p>
</div>
</header>
<!-- END: HeaderSection -->
<!-- BEGIN: FormContent -->
<section class="flex-1 overflow-y-auto px-12 py-6" data-purpose="form-scroll-area">
<form class="space-y-8 max-w-2xl mx-auto">
<!-- Row: Department & Subject -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Section Component: Select Department -->
<div class="space-y-2">
<label class="flex items-center gap-2 text-slate-700 font-medium text-sm">
<svg class="h-4 w-4 text-orange-400" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
              بخش مربوطه
            </label>
<select class="w-full bg-slate-50 border-none rounded-2xl py-3 px-4 text-slate-500 focus:ring-2 focus:ring-brand-blue">
<option value="">انتخاب بخش...</option>
<option value="1">فناوری اطلاعات</option>
<option value="2">منابع انسانی</option>
</select>
</div>
<!-- Section Component: Request Title -->
<div class="space-y-2">
<label class="flex items-center gap-2 text-slate-700 font-medium text-sm">
<svg class="h-4 w-4 text-orange-400" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
              عنوان درخواست
            </label>
<input class="w-full bg-slate-50 border-none rounded-2xl py-3 px-4 focus:ring-2 focus:ring-brand-blue" placeholder="موضوع را وارد کنید" type="text"/>
</div>
</div>
<!-- Row: Date & Recipient -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- Section Component: Referral Date -->
<div class="space-y-2">
<label class="flex items-center gap-2 text-slate-700 font-medium text-sm">
<svg class="h-4 w-4 text-orange-400" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
              تاریخ ارجاع
            </label>
<div class="relative">
<input class="w-full bg-slate-50 border-none rounded-2xl py-3 pr-10 pl-4 focus:ring-2 focus:ring-brand-blue text-left" dir="ltr" type="text" value="1405/04/29"/>
<svg class="h-5 w-5 absolute right-3 top-3.5 text-slate-400" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
<!-- Section Component: Recipient Selection -->
<div class="space-y-2">
<label class="flex items-center gap-2 text-slate-700 font-medium text-sm">
<svg class="h-4 w-4 text-orange-400" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
              ارجاع گیرنده
            </label>
<div class="relative">
<input class="w-full bg-slate-50 border-none rounded-2xl py-3 pr-10 pl-4 focus:ring-2 focus:ring-brand-blue" placeholder="جستجوی همکار..." type="text"/>
<svg class="h-5 w-5 absolute right-3 top-3.5 text-slate-400" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
</div>
<!-- Section: Priority Levels -->
<div class="space-y-3">
<label class="flex items-center gap-2 text-slate-700 font-medium text-sm">
<svg class="h-4 w-4 text-orange-400" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
            سطح اولویت
          </label>
<div class="flex flex-wrap gap-3">
<button class="px-6 py-2 rounded-xl bg-slate-50 text-slate-500 hover:bg-slate-100 transition-colors" type="button">پایین</button>
<button class="px-6 py-2 rounded-xl bg-brand-blue text-white shadow-lg shadow-blue-200" type="button">متوسط</button>
<button class="px-6 py-2 rounded-xl bg-slate-50 text-slate-500 hover:bg-slate-100 transition-colors" type="button">بالا</button>
<button class="px-6 py-2 rounded-xl bg-red-50 text-red-500 border border-red-100 hover:bg-red-100 transition-colors" type="button">بحرانی</button>
</div>
</div>
<!-- Section: Additional Comments -->
<div class="space-y-2">
<label class="flex items-center gap-2 text-slate-700 font-medium text-sm">
<svg class="h-4 w-4 text-orange-400" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
            توضیحات تکمیلی
          </label>
<textarea class="w-full bg-slate-50 border-none rounded-2xl p-4 focus:ring-2 focus:ring-brand-blue resize-none" placeholder="جزئیات درخواست را به صورت کامل شرح دهید..." rows="4"></textarea>
</div>
<!-- Section: File Upload -->
<div class="border-2 border-dashed border-blue-100 rounded-3xl p-10 bg-blue-50/30 text-center group hover:border-blue-300 transition-all cursor-pointer">
<div class="mb-4">
<div class="bg-white w-16 h-16 rounded-2xl flex items-center justify-center mx-auto shadow-sm group-hover:shadow-md transition-shadow">
<svg class="h-8 w-8 text-orange-400" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
<p class="text-slate-800 font-bold mb-1">فایل‌های پیوست را اینجا رها کنید</p>
<p class="text-slate-400 text-xs">حداکثر حجم فایل ۱۰ مگابایت</p>
</div>
</form>
</section>
<!-- END: FormContent -->
<!-- BEGIN: FooterActions -->
<footer class="p-8 bg-white border-t border-slate-50">
<div class="max-w-2xl mx-auto space-y-6">
<div class="flex flex-col gap-3">
<button class="w-full bg-brand-blue text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-xl shadow-blue-900/20 hover:bg-brand-blue/90 transition-all active:scale-[0.98]">
            ثبت درخواست
            <svg class="h-5 w-5 rotate-45" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<button class="w-full bg-white border border-slate-200 text-slate-600 py-4 rounded-2xl font-bold hover:bg-slate-50 transition-colors">
            انصراف
          </button>
</div>
<div class="flex flex-wrap justify-center gap-8 text-slate-400 text-xs font-medium pt-4 border-t border-slate-50">
<div class="flex items-center gap-2">
<span>امنیت تایید شده SSL</span>
<svg class="h-4 w-4 text-green-500" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
<div class="flex items-center gap-2">
<span>پاسخگویی در کمتر از ۲ ساعت</span>
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</div>
</div>
</div>
</footer>
<!-- END: FooterActions -->
</main>
<!-- END: MainContainer -->
</body></html>
